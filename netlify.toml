[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# No functions, Python service, API proxy, or secrets required.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/vendor/mediapipe/wasm/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
